<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seekdb × StepFun 端侧知识库</title>
  </head>
  <body>
    <main>
      <h1>seekdb × StepFun 端侧知识库</h1>
      <p class="sub">文档与查询向量均在浏览器本地计算；向量与全文混检由 seekdb 完成。</p>
      <section class="card">
        <div class="row"><strong>推理后端：</strong><span id="backend">检测中…</span></div>
        <div class="row"><strong>模型：</strong><span>Xenova/all-MiniLM-L6-v2 · INT8 (q8)</span></div>
        <div class="row"><strong>seekdb：</strong><span id="db">连接中…</span></div>
      </section>
      <section class="card">
        <h2>导入文档</h2>
        <textarea id="docs" rows="8" placeholder="每行一个文档，例如：seekdb 支持向量与全文混合检索。"></textarea>
        <div class="row">
          <button id="import">导入并向量化</button>
          <button id="clear" class="secondary">清空知识库</button>
          <span id="import-status"></span>
        </div>
      </section>
      <section class="card">
        <h2>检索</h2>
        <div class="row">
          <input id="query" placeholder="输入自然语言查询" />
          <button id="search">混合检索</button>
        </div>
        <ol id="results"></ol>
      </section>
      <section class="card">
        <h2>性能记录</h2>
        <pre id="metrics">尚未运行</pre>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
